<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tugas Individu - Pratikum Minggu Kedua</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .header {
      position: fixed;
      top: 12px;
      left: 0;
      right: 0;
      z-index: 10;
      text-align: center;
      color: white;
      background: rgba(16, 35, 75, 0.82);
      padding: 12px 8px;
      pointer-events: none;
    }

    .header h1 {
      font-size: 20px;
      margin: 0 0 5px;
    }

    .header p {
      font-size: 12px;
      margin: 3px;
    }

    .footer {
      position: fixed;
      bottom: 10px;
      left: 10px;
      right: 10px;
      z-index: 10;
      text-align: center;
      color: white;
      background: rgba(16, 35, 75, 0.8);
      padding: 9px;
      border-radius: 8px;
      font-size: 12px;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <!-- IDENTITAS TUGAS -->
  <div class="header">
    <h1>AR TUGAS INDIVIDU</h1>
    <p>Praktikum AR/VR - Minggu 2</p>
    <p>Objek 3D | Material | Lighting | Kamera | Transformasi</p>
  </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        
        <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.8" position="1 3 2"></a-light>

        <a-marker preset="hiro">
            
            <a-text value="SHERLY AYUMI FADILAH" 
                    position="0 0.05 -1.12" 
                    rotation="-90 0 0"
                    align="center"
                    width="2.1"
                    color="#FFFFFF" 
                    scale="0.8 0.8 0.8">
            </a-text>
            <a-text value="2409020115" 
                    position="0 0.05 -1.25"
                    rotation="-90 0 0"
                    width="2.1" 
                    align="center" 
                    color="#FFFFFF" 
                    scale="0.8 0.8 0.8">
            </a-text>

            <a-plane position="0 0 0" 
                     rotation="-90 0 0" 
                     width="3" 
                     height="3" 
                     color="#87CEFA" 
                     opacity="0.7" 
                     transparent="true">
            </a-plane>

            <a-cone position="-1 0.45 -0.5" 
                    radius-bottom="0.3" 
                    height="0.9" 
                    color="#F4A460">
            </a-cone>

            <a-torus position="-0.4 0.5 0.5" 
                     radius="0.3" 
                     radius-tubular="0.08" 
                     color="#9370DB" 
                     rotation="30 45 0">
            </a-torus>

            <a-cylinder position="1 0.45 -0.5" 
                        radius="0.25" 
                        height="0.9" 
                        color="#00FF7F" 
                        animation="property: rotation; to: 0 360 0; dur: 4000; loop: true; easing: linear">
            </a-cylinder>

            <a-sphere position="1.2 0.5 0.5" 
                      radius="0.35" 
                      color="#FF69B4" 
                      metalness="0.4" 
                      roughness="0.3">
            </a-sphere>

            <a-box position="0 0.4 -0.5" 
                   width="0.6" 
                   height="0.6" 
                   depth="0.6" 
                   color="#EEE8AA" 
                   animation="property: rotation; to: 0 360 0; dur: 6000; loop: true; easing: linear">
            </a-box>

        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>
<div class="footer">
    Arahkan kamera ke marker Hiro untuk menampilkan objek 3D.
  </div>

</body>
</html>
