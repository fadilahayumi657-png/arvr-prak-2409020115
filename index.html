<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Praktikum - Scene Perkenalan Diri</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <a-sky color="#242b35"></a-sky>
        <a-plane position="0 0 -4" rotation="-90 0 0" width="15" height="15" color="#87CEFA"></a-plane>

        <a-text value="SHERLY AYUMI FADILAH - 2409020115" position="0 3 -3.5" align="center" color="#808080" width="6"></a-text>

        <a-cone position="-2.8 0.9 -3.8" radius-bottom="0.7" height="1.8" color="#F4A460"></a-cone>

        <a-torus position="-1.2 1.0 -3.8" radius="0.7" radius-tubular="0.18" color="#9370DB" rotation="30 45 0"></a-torus>

        <a-cylinder position="2.7 0.9 -3.8" radius="0.6" height="1.8" color="#00FF7F"></a-cylinder>

        <a-sphere position="3.2 1 -3.8" radius="0.8" color="#FF69B4"></a-sphere>

        <a-box 
            position="0.8 1.0 -4.2" 
            width="1.4" height="1.4" depth="1.4" 
            color="#EEE8AA"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
        </a-box>
    </a-scene>
</body>
</html>
